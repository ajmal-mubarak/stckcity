<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StockCity — Mobile Distribution Management</title>
    <meta name="description" content="StockCity — Mobile Distribution Management System" />

    <!-- Dynamically inject the correct PWA manifest based on route -->
    <script>
      (function () {
        var path = window.location.pathname;
        var isAdmin = path.startsWith('/admin');
        var link = document.createElement('link');
        link.rel = 'manifest';
        link.href = isAdmin ? '/manifest-admin.json' : '/manifest-shop.json';
        document.head.appendChild(link);

        // Theme colour for address bar
        var meta = document.createElement('meta');
        meta.name = 'theme-color';
        meta.content = isAdmin ? '#4f46e5' : '#111827';
        document.head.appendChild(meta);
      })();
    </script>

    <!-- iOS / Safari PWA support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="/icons/shop-192.png" id="apple-touch-icon" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/shop-192.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
